<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 人格测试 - 发现真实的自己</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    width: 100%; max-width: 720px; padding: 48px 40px;
    position: relative; overflow: hidden;
  }
  /* ---- Splash ---- */
  .splash { text-align: center; padding: 60px 0; }
  .splash-badge {
    display: inline-block;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 6px 20px;
    border-radius: 50px;
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  .splash h1 {
    font-size: 38px;
    font-weight: 900;
    color: #1a1a2e;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .splash h1 .accent {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .splash .byline {
    font-size: 15px;
    color: #999;
    margin-bottom: 40px;
  }
  .splash .cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .splash .cta-hint {
    font-size: 12px;
    color: #bbb;
  }
  .splash-input {
    border: none;
    border-bottom: 2px solid #e0e0e8;
    font-size: 36px;
    font-weight: 900;
    color: #1a1a2e;
    text-align: center;
    width: 220px;
    padding: 8px 0;
    outline: none;
    font-family: inherit;
    background: transparent;
    transition: border-color 0.3s;
    caret-color: #667eea;
  }
  .splash-input:focus { border-bottom-color: #667eea; }
  .splash-input::placeholder { color: #ccc; font-weight: 400; font-size: 24px; }
  .splash-greeting { font-size: 38px; font-weight: 900; color: #1a1a2e; line-height: 1.3; min-height: 50px; }
  .splash-greeting .accent {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .welcome { text-align: center; display: none; }
  .welcome.show { display: block; }
  .welcome .icon { font-size: 72px; margin-bottom: 16px; }
  .welcome h1 { font-size: 32px; font-weight: 800; color: #1a1a2e; margin-bottom: 12px; }
  .welcome .subtitle { font-size: 15px; color: #666; line-height: 1.8; margin-bottom: 36px; }
  .welcome ul { text-align: left; display: inline-block; margin-bottom: 32px; }
  .welcome li { font-size: 14px; color: #555; line-height: 2.2; padding-left: 8px; }
  .btn { display: inline-block; padding: 14px 44px; border: none; border-radius: 50px;
    font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
  .btn-outline { background: #fff; color: #667eea; border: 2px solid #667eea; }
  .btn-outline:hover { background: #f4f4ff; }
  .quiz { display: none; }
  .quiz.show { display: block; }
  .progress-wrap { margin-bottom: 32px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: #999; margin-bottom: 8px; }
  .progress-bar { height: 6px; background: #e8e8f0; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 3px; transition: width 0.4s ease; }
  .question-counter { font-size: 13px; color: #764ba2; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
  .question-text { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 28px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option { padding: 15px 22px; border: 2px solid #e0e0e8; border-radius: 14px;
    cursor: pointer; transition: all 0.25s ease; font-size: 15px; color: #444;
    display: flex; align-items: center; gap: 12px; }
  .option:hover { border-color: #667eea; background: #f8f8ff; }
  .option.selected { border-color: #667eea; background: linear-gradient(135deg, #f0f0ff 0%, #f8f4ff 100%);
    color: #1a1a2e; font-weight: 600; }
  .option .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #ccc;
    flex-shrink: 0; transition: all 0.25s ease; }
  .option.selected .dot { border-color: #667eea; background: #667eea; box-shadow: inset 0 0 0 4px #fff; }
  .nav-btns { display: flex; justify-content: space-between; margin-top: 32px; }
  .result { display: none; }
  .result.show { display: block; }
  .result-header { text-align: center; }
  .result-badge { display: inline-block; font-size: 52px; font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 8px; }
  .result-name { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
  .result-tagline { font-size: 14px; color: #888; margin-bottom: 24px; font-style: italic; }
  .dimensions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  .dim { background: #f8f8ff; border-radius: 14px; padding: 18px 16px; text-align: center; }
  .dim-label { font-size: 13px; color: #999; margin-bottom: 6px; }
  .dim-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: center; }
  .dim-side { font-size: 20px; font-weight: 800; color: #888; width: 28px; transition: all 0.5s ease; }
  .dim-side.active { color: #667eea; font-size: 24px; }
  .dim-bar { flex: 1; height: 8px; background: #e0e0e8; border-radius: 4px; overflow: hidden; position: relative; }
  .dim-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width 0.8s ease; }
  .dim-pct { font-size: 12px; color: #666; width: 40px; text-align: center; }

  .result-section { background: #f8f8ff; border-radius: 14px; padding: 22px 24px; margin-bottom: 16px; text-align: left; }
  .result-section h3 { font-size: 16px; color: #667eea; margin-bottom: 10px; font-weight: 700; }
  .result-section p { line-height: 1.9; font-size: 14px; color: #555; }
  .result-section ul { padding-left: 20px; line-height: 2; font-size: 14px; color: #555; }

  .result-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 0.5s ease forwards; }
  @media (max-width: 500px) {
    .container { padding: 32px 20px; border-radius: 18px; }
    .welcome h1 { font-size: 26px; }
    .question-text { font-size: 17px; }
    .dimensions { grid-template-columns: 1fr; }
    .result-badge { font-size: 40px; }
  }
</style>
</head>
<body>

<div class="container" id="app">

  <!-- ====== SPLASH ====== -->
  <div class="splash fade-in" id="splash">
    <div class="splash-badge">MBTI Personality Test</div>
    <input class="splash-input" id="nameInput" type="text" placeholder="你的名字" maxlength="10" oninput="updateGreeting()">
    <div class="splash-greeting" id="greeting"></div>
    <p class="byline">发现最真实的自己，只需要 8 分钟</p>
    <div class="cta">
      <button class="btn btn-primary" onclick="goToWelcome()">开始探索 →</button>
      <span class="cta-hint">72 道题 · 16 种人格结果 · 深度解读</span>
    </div>
  </div>

  <!-- ====== WELCOME ====== -->
  <div class="welcome fade-in" id="welcome">
    <div class="icon">🧠</div>
    <h1>MBTI 人格测试</h1>
    <p class="subtitle">基于荣格心理类型理论，帮助你深入了解自己的<br>性格倾向、行为模式和潜在优势。</p>
    <ul>
      <li>📋 共 72 道精心设计的选择题</li>
      <li>⏱️ 约 8-10 分钟完成</li>
      <li>🔬 四个维度 × 18 题 = 更精准的评估</li>
      <li>📖 16种人格类型 + 深度解读与建议</li>
    </ul>
    <br>
    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
  </div>

  <!-- ====== QUIZ ====== -->
  <div class="quiz" id="quiz">
    <div class="progress-wrap">
      <div class="progress-text"><span id="qNum">1 / 72</span><span id="qPct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="question-counter" id="qDimension"></div>
    <div class="question-text fade-in" id="qText"></div>
    <div class="options fade-in" id="qOptions"></div>
    <div class="nav-btns">
      <button class="btn btn-outline" id="btnPrev" onclick="prevQuestion()" style="visibility:hidden">← 上一题</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- ====== RESULT ====== -->
  <div class="result" id="result">
    <div class="result-header">
      <div class="result-badge" id="rType"></div>
      <div class="result-name" id="rName"></div>
      <div class="result-tagline" id="rTagline"></div>
    </div>
    <div class="dimensions" id="rDims"></div>
    <div id="rSections"></div>
    <div class="result-actions">
      <button class="btn btn-primary" onclick="restartQuiz()">重新测试</button>
      <button class="btn btn-outline" onclick="shareResult()">📤 分享结果</button>
    </div>
  </div>

</div>

<script>
// ==================== QUESTIONS (72 total, 18 per dimension) ====================
const questions = [
  // ===== E/I — 18 题 =====
  {q:"参加完一场热闹的聚会后，你的感觉通常是：",dim:"EI",opts:["精力充沛，还想继续社交","有点累，需要独处恢复能量"]},
  {q:"空闲的时候，你更倾向于：",dim:"EI",opts:["约朋友出去玩","一个人安静地待着"]},
  {q:"在团队讨论中，你通常：",dim:"EI",opts:["主动发言，边说边想","先听完别人，想清楚再开口"]},
  {q:"认识新朋友对你来说：",dim:"EI",opts:["是一件令人兴奋的事","有点紧张，需要时间适应"]},
  {q:"当你遇到烦恼时，你更倾向于：",dim:"EI",opts:["找朋友倾诉，说出来会好受些","自己消化，不太想打扰别人"]},
  {q:"你的社交圈通常是：",dim:"EI",opts:["广泛，认识很多人","小而精，有几个深交的朋友"]},
  {q:"在开放式办公室里工作，你的感受是：",dim:"EI",opts:["喜欢这种热闹和随时沟通的氛围","觉得被打扰，需要一个安静独立的空间"]},
  {q:"接电话和发文字消息，你更喜欢：",dim:"EI",opts:["直接打电话，快速有效","发消息，可以思考后再回复"]},
  {q:"以下哪种说法更符合你：",dim:"EI",opts:["与人交流让我获得能量","独处让我恢复能量"]},
  {q:"周末你最期待的放松方式是：",dim:"EI",opts:["和朋友聚会、参加活动","在家看书、看电影或做自己的事"]},
  {q:"在人群中，你通常：",dim:"EI",opts:["是活跃气氛的那个人","安静观察，享受旁观"]},
  {q:"面对一个需要深度思考的问题，你倾向于：",dim:"EI",opts:["找人讨论，在交流中理清思路","自己先想透彻了再和别人说"]},
  {q:"你更擅长：",dim:"EI",opts:["同时处理多件事情，快速切换","专注一件事，深入挖掘"]},
  {q:"新加入一个团体时，你通常：",dim:"EI",opts:["很快融入，主动和人打招呼","先观察一段时间再慢慢融入"]},
  {q:"表达情绪时你更倾向于：",dim:"EI",opts:["直接表达，喜怒形于色","克制内敛，不轻易表露"]},
  {q:"你觉得一天中最有效率的时间是：",dim:"EI",opts:["和团队一起协作的时候","独自安静工作的时候"]},
  {q:"面对一个演讲机会，你：",dim:"EI",opts:["很兴奋，这是展示自己的好机会","会紧张，需要充分准备才有信心"]},
  {q:"你的朋友会怎样形容你：",dim:"EI",opts:["外向、热情、善于表达","内敛、沉稳、善于倾听"]},

  // ===== S/N — 18 题 =====
  {q:"学习新事物时，你更喜欢：",dim:"SN",opts:["从具体案例和实操入手","先理解整体概念和理论框架"]},
  {q:"你更相信：",dim:"SN",opts:["过往的经验和事实","自己的直觉和灵感"]},
  {q:"描述一件事情时，你更关注：",dim:"SN",opts:["细节、步骤和实际情况","整体画面、可能性和未来影响"]},
  {q:"做决定时，你更依赖：",dim:"SN",opts:["已经验证过的方法","新的创意和可能性"]},
  {q:"阅读一本书时，你更享受：",dim:"SN",opts:["情节清晰、细节丰富的故事","充满隐喻和想象空间的作品"]},
  {q:"在工作中，你更擅长：",dim:"SN",opts:["把现有流程做得更精细","提出新的方向和突破性的想法"]},
  {q:"解决一个困难问题时，你通常：",dim:"SN",opts:["一步步分析已有的数据和信息","跳过细节，凭直觉找到方向"]},
  {q:"你更关注：",dim:"SN",opts:["当下正在发生的事情","未来的可能性和趋势"]},
  {q:"拿到一份组装说明书，你通常：",dim:"SN",opts:["按照说明书的步骤一步步来","大致看一下就开始动手尝试"]},
  {q:"以下哪种更吸引你：",dim:"SN",opts:["实用且经过验证的技能","新奇有趣但未经检验的理论"]},
  {q:"开会时，如果你觉得讨论跑偏了，你更可能：",dim:"SN",opts:["提醒大家回到现实和具体问题上","觉得「跑偏」的部分反而更有启发"]},
  {q:"对于一成不变的例行工作，你的态度是：",dim:"SN",opts:["可以接受，稳定可靠很重要","感到窒息，渴望变化和新的挑战"]},
  {q:"你更喜欢哪种老师：",dim:"SN",opts:["讲得具体、条理清晰、有案例的","视野开阔、能引发思考、打破常规的"]},
  {q:"朋友找你参谋一个想法时，你通常：",dim:"SN",opts:["问细节：预算多少、怎么落地","问愿景：你为什么要做、长远看呢"]},
  {q:"面对一个抽象概念，比如「自由」，你：",dim:"SN",opts:["觉得太虚了，想知道它具体意味着什么","很兴奋，享受探讨这种话题"]},
  {q:"旅行时你最感兴趣的是：",dim:"SN",opts:["当地的美食、建筑、可以亲身体验的东西","当地的文化、历史、背后的故事和意义"]},
  {q:"处理数据报表时，你倾向于：",dim:"SN",opts:["仔细核对每一个数字","先看整体趋势，数字差一点没关系"]},
  {q:"你觉得创新和改良哪个更重要：",dim:"SN",opts:["改良，把现有的东西做得更好","创新，创造前所未有的东西"]},

  // ===== T/F — 18 题 =====
  {q:"做重要决定时，你优先考虑：",dim:"TF",opts:["逻辑、数据和客观利弊","对相关人的影响和感受"]},
  {q:"当同事和你有不同意见时，你通常：",dim:"TF",opts:["直接指出逻辑上的问题","先理解对方的感受和出发点"]},
  {q:"你更欣赏哪种品质：",dim:"TF",opts:["理性、公正、善于分析","温暖、共情、善于关怀"]},
  {q:"批评别人时，你倾向于：",dim:"TF",opts:["直截了当，就事论事","委婉表达，注意不伤感情"]},
  {q:"选择职业时，你更看重：",dim:"TF",opts:["薪资、前景和理性匹配度","兴趣、意义和是否喜欢那个环境"]},
  {q:"看到别人哭泣，你的第一反应是：",dim:"TF",opts:["思考发生了什么、怎么解决问题","感到心疼，想上去安慰"]},
  {q:"处理团队冲突时，你认为最重要的是：",dim:"TF",opts:["找到公平合理的解决方案","维护团队的和睦关系"]},
  {q:"对于违反规则的人，你倾向于：",dim:"TF",opts:["按规则处理，一视同仁","了解背后的原因，酌情考虑"]},
  {q:"以下哪种说法更符合你：",dim:"TF",opts:["我更相信头脑的判断","我常常听从内心的声音"]},
  {q:"面对一个艰难决定，你更依赖：",dim:"TF",opts:["列出优缺点清单，权衡利弊","感受哪种选择让我内心更平静"]},
  {q:"在团队中，你通常扮演：",dim:"TF",opts:["提出不同意见、指出风险的人","调和气氛、照顾每个人感受的人"]},
  {q:"评价一个方案时，你首先看：",dim:"TF",opts:["这个方案是否有效、可行","这个方案有没有考虑到人的因素"]},
  {q:"给别人反馈时你倾向于：",dim:"TF",opts:["先指出需要改进的地方","先肯定对方的努力和付出"]},
  {q:"对于「善意的谎言」，你认为：",dim:"TF",opts:["真相更重要，即使它让人不舒服","有时谎言是为了保护别人的感受"]},
  {q:"你觉得工作中效率和人情哪个更重要：",dim:"TF",opts:["效率优先，结果说话","人情重要，愉快的工作氛围不可少"]},
  {q:"当朋友做了一个你认为不明智的决定，你会：",dim:"TF",opts:["直接告诉他你的分析和担忧","尊重他的选择，默默支持"]},
  {q:"你更容易被哪种演讲打动：",dim:"TF",opts:["数据详实、论证严密的演讲","情感真挚、引人共鸣的演讲"]},
  {q:"回顾自己的人生，你觉得最重要的是：",dim:"TF",opts:["我取得了哪些成就和进步","我和谁共度了这些时光"]},

  // ===== J/P — 18 题 =====
  {q:"面对一个项目，你倾向于：",dim:"JP",opts:["制定详细计划，按步骤推进","先做起来，边做边调整"]},
  {q:"你的桌面和工作空间通常是：",dim:"JP",opts:["整洁有序，东西都在固定位置","有点随意，但我知道东西在哪"]},
  {q:"旅行时你更喜欢：",dim:"JP",opts:["提前做好攻略，按日程走","随性而行，走到哪算哪"]},
  {q:"截止日期临近时，你通常：",dim:"JP",opts:["早就做好了，不喜欢赶工","在压力下效率最高，最后一刻冲刺"]},
  {q:"对于不确定的事情，你的态度是：",dim:"JP",opts:["尽快做决定，消除不确定性","保持开放，看看还有什么可能"]},
  {q:"你的日程表通常是：",dim:"JP",opts:["安排得比较满，喜欢有计划的生活","留有余地，随时可以调整"]},
  {q:"做决定时你通常：",dim:"JP",opts:["果断，不喜欢悬而未决","反复权衡，希望保留更多选择"]},

// ==================== STATE ====================
let currentQ = 0, answers = {}, selectedOption = null, userName = '';

function updateGreeting() {
  userName = document.getElementById('nameInput').value.trim();
  const el = document.getElementById('greeting');
  if (userName) {
    el.innerHTML = `${userName}，欢迎你<span class="accent">测试</span>！`;
  } else {
    el.innerHTML = '';
  }
}

function goToWelcome() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('welcome').classList.add('show');
}

function startQuiz() {
  currentQ = 0; answers = {}; selectedOption = null;
  document.getElementById('welcome').classList.remove('show');
  document.getElementById('result').classList.remove('show');
  document.getElementById('quiz').classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = `${currentQ + 1} / ${questions.length}`;
  document.getElementById('qPct').textContent = Math.round((currentQ / questions.length) * 100) + '%';
  document.getElementById('progressFill').style.width = ((currentQ / questions.length) * 100) + '%';
  const dimNames = { EI:'精力来源 (E/I)', SN:'认知方式 (S/N)', TF:'决策方式 (T/F)', JP:'生活方式 (J/P)' };
  document.getElementById('qDimension').textContent = dimNames[q.dim];

  const qt = document.getElementById('qText');
  qt.classList.remove('fade-in'); void qt.offsetWidth; qt.classList.add('fade-in');
  qt.textContent = q.q;

  const optsDiv = document.getElementById('qOptions');
  optsDiv.classList.remove('fade-in'); void optsDiv.offsetWidth; optsDiv.classList.add('fade-in');
  optsDiv.innerHTML = '';
  selectedOption = answers[currentQ] !== undefined ? answers[currentQ] : null;
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (selectedOption === i ? ' selected' : '');
    div.innerHTML = `<span class="dot"></span>${opt}`;
    div.onclick = () => selectOption(i);
    optsDiv.appendChild(div);
  });
  updateNavButtons();
}

function selectOption(i) {
  selectedOption = i; answers[currentQ] = i;
  document.querySelectorAll('.option').forEach((el, idx) => el.classList.toggle('selected', idx === i));
  updateNavButtons();
}

function updateNavButtons() {
  const prev = document.getElementById('btnPrev');
  const next = document.getElementById('btnNext');
  prev.style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  next.textContent = currentQ === questions.length - 1 ? '查看结果 ✨' : '下一题 →';
  next.style.opacity = selectedOption === null ? '0.5' : '1';
  next.style.pointerEvents = selectedOption === null ? 'none' : 'auto';
}

function nextQuestion() {
  if (selectedOption === null) return;
  if (currentQ < questions.length - 1) { currentQ++; selectedOption = answers[currentQ] !== undefined ? answers[currentQ] : null; renderQuestion(); }
  else showResult();
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; selectedOption = answers[currentQ] !== undefined ? answers[currentQ] : null; renderQuestion(); }
}

// ==================== SCORING ====================
function calculateResult() {
  const dims = { EI:0, SN:0, TF:0, JP:0 };
  const counts = { EI:0, SN:0, TF:0, JP:0 };
  questions.forEach((q, i) => { const ans = answers[i] || 0; dims[q.dim] += ans; counts[q.dim]++; });
  let type = '';
  type += dims.EI <= 8 ? 'E' : 'I';
  type += dims.SN <= 8 ? 'S' : 'N';
  type += dims.TF <= 8 ? 'T' : 'F';
  type += dims.JP <= 8 ? 'J' : 'P';
  return { type, dims, counts };
}

function showResult() {
  const { type, dims, counts } = calculateResult();
  document.getElementById('quiz').classList.remove('show');
  document.getElementById('result').classList.add('show');
  const data = typeData[type];
  document.getElementById('rType').textContent = type;
  document.getElementById('rName').textContent = data.name;
  document.getElementById('rTagline').textContent = data.tagline;

  const dimDefs = [
    { left:'E', right:'I', key:'EI', leftLabel:'外向 (Extraversion)', rightLabel:'内向 (Introversion)' },
    { left:'S', right:'N', key:'SN', leftLabel:'实感 (Sensing)', rightLabel:'直觉 (Intuition)' },
    { left:'T', right:'F', key:'TF', leftLabel:'思考 (Thinking)', rightLabel:'情感 (Feeling)' },
    { left:'J', right:'P', key:'JP', leftLabel:'判断 (Judging)', rightLabel:'感知 (Perceiving)' },
  ];

  document.getElementById('rDims').innerHTML = dimDefs.map(d => {
    const score = dims[d.key], total = counts[d.key];
    const leftPct = Math.round(((total - score) / total) * 100);
    const rightPct = Math.round((score / total) * 100);
    const isLeft = score <= total / 2;
    return `<div class="dim">
      <div class="dim-label">${d.leftLabel} · ${d.rightLabel}</div>
      <div class="dim-bar-wrap">
        <span class="dim-side ${isLeft?'active':''}">${d.left}</span>
        <div class="dim-bar"><div class="dim-fill" style="width:${isLeft?leftPct:rightPct}%"></div></div>
        <span class="dim-side ${!isLeft?'active':''}">${d.right}</span>
        <span class="dim-pct">${isLeft?leftPct:rightPct}%</span>
      </div></div>`;
  }).join('');

  document.getElementById('rSections').innerHTML = `
    <div class="result-section"><h3>📖 人格概述</h3><p>${data.overview}</p></div>
    <div class="result-section"><h3>💪 核心优势</h3><ul>${data.strengths.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="result-section"><h3>⚠️ 潜在短板</h3><ul>${data.weaknesses.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="result-section"><h3>💼 适合职业</h3><p>${data.careers}</p></div>
    <div class="result-section"><h3>❤️ 亲密关系</h3><p>${data.relationships}</p></div>
    <div class="result-section"><h3>🌱 成长建议</h3><p>${data.growth}</p></div>
  `;

  document.getElementById('result').scrollIntoView({ behavior:'smooth' });
}

function restartQuiz() {
  document.getElementById('result').classList.remove('show');
  document.getElementById('quiz').classList.remove('show');
  document.getElementById('welcome').classList.remove('show');
  document.getElementById('splash').style.display = '';
  document.getElementById('nameInput').value = '';
  document.getElementById('greeting').innerHTML = '';
  userName = '';
  currentQ = 0; answers = {}; selectedOption = null;
  window.scrollTo({ top:0, behavior:'smooth' });
}

function shareResult() {
  const { type } = calculateResult();
  const data = typeData[type];
  const prefix = userName ? `${userName}的` : '我的';
  const text = `🧠 ${prefix} MBTI 人格类型是 ${type}「${data.name}」— ${data.tagline}！来测测你是什么类型？👉 https://alan-chan888.github.io/mbti-test/`;
  if (navigator.share) { navigator.share({ title:'MBTI 人格测试', text }); }
  else { navigator.clipboard.writeText(text).then(() => alert('已复制分享文案！')); }
}
